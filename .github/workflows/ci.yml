name: ci
on:
  pull_request:
  push:
    branches: [cloud/**]
permissions:
  contents: read
jobs:
  social-and-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: social/package-lock.json }
      # resources.test.js asserts the render's gsap comes from node_modules, not a CDN
      - run: cd social && npm ci
      - run: cd social && node --test lib.test.js score.test.js reel-qa.test.js resources.test.js
      - run: node --test pipeline/research/spend-guard.test.js
      # worker.js, approval-server.js and draft.js are runtime-only (Mac paths, Meta tokens, the
      # WhatsApp bridge) so they have no tests; at least parse them so a syntax error cannot land.
      - run: cd social && node --check worker.js && node --check approval-server.js && node --check draft.js
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: cd site && npm ci && npm run build
