name: ci
on:
  pull_request:
  push:
    branches: [cloud/**]
permissions:
  contents: read
jobs:
  social-and-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd social && node --test lib.test.js score.test.js reel-qa.test.js
      - run: node --test pipeline/research/spend-guard.test.js
  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: cd site && npm ci && npm run build
