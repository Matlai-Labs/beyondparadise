<title>Beyond Paradise: review</title>

</head>

<header>
  <h1>Beyond Paradise: review</h1>
  <p id="step-note">Step 2: you can decide here. Approve, Skip and Edit are saved at once. Undo is under What I decided.</p>
  <div id="status" aria-live="polite"></div>
  <button type="button" id="stop-all">Stop all posting</button>
  <ul id="problems"></ul>
</header>
<div id="filters">
  <button type="button" data-kind="all" aria-pressed="true">All</button>
  <button type="button" data-kind="clip" aria-pressed="false">Clips</button>
  <button type="button" data-kind="hook" aria-pressed="false">Video texts</button>
  <button type="button" id="refresh">Reload</button>
</div>
<p id="unavailable" class="hidden"></p>
<main id="main">
  <div id="list-wrap">
    <ul id="list"></ul>
    <button type="button" id="more" class="hidden">Show more</button>
  </div>
  <div id="side">
  <section id="card" aria-label="Current card">
    <p id="card-kind"></p>
    <h2 id="card-title" tabindex="-1"></h2>
    <p id="video-quiet" class="hidden"></p>
    <p id="state" aria-live="polite"></p>
    <div id="video-slot"></div>
    <div id="facts"></div>
    <p id="idline"></p>
    <div id="actions" class="hidden">
      <button type="button" id="act-approve">Approve</button>
      <button type="button" id="act-skip">Skip</button>
      <button type="button" id="act-edit">Edit</button>
    </div>
    <div id="edit-box" class="hidden">
      <label for="edit-text">New text for the video, at most 60 characters</label>
      <textarea id="edit-text" rows="2"></textarea>
      <p id="edit-count">0 of 60</p>
      <div id="edit-buttons">
        <button type="button" id="edit-save">Save and approve</button>
        <button type="button" id="edit-cancel">Cancel</button>
      </div>
      <p id="edit-error" aria-live="polite"></p>
    </div>
    <p id="notice" aria-live="polite"></p>
    <p id="swipe-hint">Swipe left or right, or use the buttons.</p>
    <div id="nav">
      <button type="button" id="prev">Back</button>
      <span id="counter"></span>
      <button type="button" id="next">Next</button>
    </div>
  </section>
  <details id="decided">
    <summary id="decided-summary">What I decided (0)</summary>
    <ul id="decided-list"></ul>
  </details>
  </div>
</main>

function keyAction(e, ctx) {
  if (ctx.editing && e.key === 'Escape') return 'cancel';
  if (!ctx.wide || ctx.typing || ctx.busy || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return null;
  const m = { a: 'approve', s: 'skip', e: 'edit' }[String(e.key).toLowerCase()];
  return m && ctx.actions.indexOf(m) >= 0 ? m : null;
}
function decidedLine(item) {
  const title = item.kind === 'clip' ? clipTitle(item) : item.title;
  return 'You ' + (item.decision && item.decision.kind === 'skipped' ? 'skipped' : 'approved') + ' "' + title + '".';
}
function stopButtonText(o) {
  o = o || {};
  if (o.stopped) return o.armed ? 'Tap again to allow posting' : 'Allow posting again';
  return o.armed ? 'Tap again to stop all posting' : 'Stop all posting';
}
// END PURE

const $ = (id) => document.getElementById(id);
const state = { items: [], kind: 'all', index: 0, shown: LIST_PAGE, currentId: null, key: null };
let retryTimer = null;

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function showStatus(s, problems) {
  const box = $('status'); clear(box);
  for (const line of statusLines(s, Date.now())) {
    const span = el('span', line); const hint = statusHint(line);
    if (hint) {
      span.setAttribute('title', hint); span.setAttribute('tabindex', '0'); span.style.whiteSpace = 'normal';
      const note = el('small', hint, 'hint hidden'); span.appendChild(note);
      span.addEventListener('click', () => { note.classList.toggle('hidden'); });
    }
    box.appendChild(span);
  }
  const pl = $('problems'); clear(pl);
  for (const p of problems || []) pl.appendChild(el('li', LABELS[p] || 'Something could not be read.'));
}

function shownItems() { return filterItems(waitingItems(state.items), state.kind); }

let videoTimer = null; let videoSerial = 0;
function stopVideo() {
  videoSerial++;
  if (videoTimer) { clearTimeout(videoTimer); videoTimer = null; }
  const slot = $('video-slot');
  for (const v of Array.from(slot.querySelectorAll('video'))) { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); }
  clear(slot);
}

function showVideo(item) {
  stopVideo(); const slot = $('video-slot'); const quiet = $('video-quiet');
  const q = quietLine(item); quiet.textContent = q || ''; quiet.classList.toggle('hidden', !q);
  if (q) return; // a video text has no example video in this step: no black box, only the quiet line
  if (item.preview && item.preview.mediaId) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = false; v.controls = true;
    v.setAttribute('aria-label', 'Preview video');
    const wrap = el('div', undefined, 'vwrap'); const btn = el('button', PLAY_TEXT, 'play-big'); btn.type = 'button';
    const line = el('p', '', 'video-line'); line.setAttribute('aria-live', 'polite');
    const st = { reduce, playing: false, playRejected: false, errored: false, loadedWithin8s: undefined };
    let dead = false;
    const refresh = () => {
      if (dead) return;
      const ui = videoUi(st);
      if (ui.errorSentence) {
        dead = true; stopVideo(); const mine = videoSerial;
        fetch('api/items', { cache: 'no-store' }).then((res) => res.status, () => null).then((probeStatus) => {
          if (mine !== videoSerial) return; // another card is shown now
          if (videoFailureAction({ probeStatus, alreadyReloaded: !!sessionStorage.getItem('bpa_reloaded') }) === 'reload') { sessionStorage.setItem('bpa_reloaded', '1'); location.reload(); return; }
          slot.appendChild(el('p', VIDEO_FAILED_TEXT, 'video-note'));
        });
        return;
      }
      btn.classList.toggle('hidden', !ui.button);
      line.textContent = ui.playingLine ? PLAYING_LINE : (ui.pausedLine ? PAUSED_LINE : '');
    };
    const sync = () => { st.playing = !v.paused && !v.ended; refresh(); };
    const start = () => {
      const p = v.play();
      if (p && typeof p.then === 'function') p.then(() => { st.playRejected = false; sync(); }, () => { if (!dead) { st.playRejected = true; sync(); } });
    };
    for (const ev of ['play', 'playing', 'pause', 'ended']) v.addEventListener(ev, sync);
    v.addEventListener('loadeddata', () => { if (videoTimer) { clearTimeout(videoTimer); videoTimer = null; } st.loadedWithin8s = true; refresh(); });
    v.addEventListener('error', () => { st.errored = true; refresh(); });
    btn.addEventListener('click', (e) => { e.stopPropagation(); start(); });
    // Most browsers already toggle pause and play when the picture is clicked (native controls are on). If the click changed nothing, toggle here; if it did, do nothing, or the two would cancel each other.
    v.addEventListener('click', () => { const before = v.paused; setTimeout(() => { if (!dead && v.paused === before) { if (before) start(); else v.pause(); } }, 60); });
    v.src = 'media/' + item.preview.mediaId;
    videoTimer = setTimeout(() => { videoTimer = null; st.loadedWithin8s = false; refresh(); }, VIDEO_WAIT_MS);
    wrap.appendChild(v); wrap.appendChild(btn); slot.appendChild(wrap); slot.appendChild(line);
    refresh();
    if (shouldAutoplay(reduce)) start();
    if (item.kind === 'hook') slot.appendChild(el('p', EXAMPLE_NOTE, 'video-note'));
  } else {
    slot.appendChild(el('p', noteText(item) || 'No video.', 'video-note'));
  }
}

function showFacts(item) {
  const box = $('facts'); clear(box);
  for (const row of factLines(item)) { const p = el('p'); p.appendChild(el('strong', row[0] + ' ')); p.appendChild(document.createTextNode(String(row[1]))); box.appendChild(p); }
  $('idline').textContent = item.kind === 'clip' ? 'Clip number ' + item.id : '';
}

function renderList() {
  const list = $('list'); clear(list); const items = shownItems();
  const w = windowOf(items.length, state.index, LIST_PAGE); if (w.to > state.shown) state.shown = w.to;
  const upto = Math.min(items.length, state.shown);
  for (let i = 0; i < upto; i++) {
    const li = el('li'); const b = el('button', rowText(items[i])); b.type = 'button';
    if (i === state.index) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', () => { state.index = i; renderCard(true); renderList(); });
    li.appendChild(b); list.appendChild(li);
  }
  $('more').classList.toggle('hidden', upto >= items.length);
}

function renderFilters() {
  const c = countKinds(waitingItems(state.items)); const names = { all: 'All', clip: 'Clips', hook: 'Video texts' };
  for (const b of document.querySelectorAll('#filters button[data-kind]')) { const k = b.getAttribute('data-kind'); b.textContent = names[k] + ' ' + c[k]; b.setAttribute('aria-pressed', k === state.kind ? 'true' : 'false'); }
}

function renderCard(moved) {
  const items = shownItems(); const n = items.length;
  if (n === 0) {
    stopVideo(); $('video-quiet').classList.add('hidden'); $('card-kind').textContent = ''; $('card-title').textContent = ''; $('state').textContent = 'Nothing waits here. Pick another filter.'; $('actions').classList.add('hidden'); closeEdit(); clear($('facts')); $('idline').textContent = ''; $('counter').textContent = '';
    $('prev').disabled = true; $('next').disabled = true; state.currentId = null; state.key = null; return;
  }
  state.index = moveIndex(state.index, 0, n); const item = items[state.index];
  $('prev').disabled = state.index <= 0; $('next').disabled = state.index >= n - 1;
  $('card-kind').textContent = item.kind === 'hook' ? 'Proposed video text' : 'Clip';
  $('card-title').textContent = item.kind === 'hook' ? item.title : clipTitle(item);
  $('state').textContent = stateLine(item);
  $('counter').textContent = 'Card ' + (state.index + 1) + ' of ' + n;
  const key = item.id + '|' + item.version;
  if (state.key !== key) { showVideo(item); state.key = key; }
  state.currentId = item.id; if (state.editing && state.editId !== item.id) closeEdit();
  showFacts(item); renderActions(item);
  if (moved) { closeEdit(); $('card-title').focus({ preventScroll: true }); }
}

function renderAll() { renderFilters(); renderList(); renderCard(false); renderDecided(); }

function move(delta) { const n = shownItems().length; const next = moveIndex(state.index, delta, n); if (next === state.index) return; state.index = next; renderCard(true); renderList(); }

function showUnavailable(text) {
  stopVideo(); const u = $('unavailable'); u.textContent = text; u.classList.remove('hidden'); $('main').classList.add('hidden'); $('filters').classList.add('hidden'); clear($('status')); clear($('problems'));
}
const CANNOT_LOAD = 'The page cannot load. Open it again from your own device with Tailscale switched on.';

async function load() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  let res;
  try { res = await fetch('api/items', { cache: 'no-store' }); } catch (e) { showUnavailable(CANNOT_LOAD); return; }
  if (res.status === 403 || res.status === 503 || !res.ok) {
    if (!sessionStorage.getItem('bpa_reloaded')) { sessionStorage.setItem('bpa_reloaded', '1'); location.reload(); return; }
    showUnavailable(CANNOT_LOAD); return;
  }
  sessionStorage.removeItem('bpa_reloaded');
  let data; try { data = await res.json(); } catch (e) { showUnavailable(CANNOT_LOAD); return; }
  $('unavailable').classList.add('hidden'); $('main').classList.remove('hidden'); $('filters').classList.remove('hidden');
  const keep = state.currentId; state.items = Array.isArray(data.items) ? data.items : [];
  showStatus(data.status, data.problems);
  const items = shownItems(); const at = keep ? items.findIndex((i) => i.id === keep) : -1;
  state.index = at >= 0 ? at : (keep ? state.index : 0); if (at < 0) { state.currentId = null; state.key = null; }
  stopUi.stopped = !!(data.status && data.status.stop && data.status.stop.stopped === true); renderStop();
  renderAll();
  if (actionToken === null && !tokenAsked) { tokenAsked = true; fetchToken(); }
  if (anyPending(state.items)) retryTimer = setTimeout(load, 5000);
}

for (const b of document.querySelectorAll('#filters button[data-kind]')) b.addEventListener('click', () => { state.kind = b.getAttribute('data-kind'); state.index = 0; state.shown = LIST_PAGE; state.currentId = null; state.key = null; renderAll(); });
$('prev').addEventListener('click', () => move(-1));
$('next').addEventListener('click', () => move(1));
$('refresh').addEventListener('click', () => { load(); });
$('more').addEventListener('click', () => { state.shown += LIST_PAGE; renderList(); });
document.addEventListener('keydown', (e) => {
  if (isTyping(e)) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  if (!window.matchMedia('(min-width: 900px)').matches) return;
  if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); move(-1); }
  else if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); move(1); }
});
let touchX = 0; let touchY = 0;
$('card').addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; touchX = t.clientX; touchY = t.clientY; }, { passive: true });
$('card').addEventListener('touchend', (e) => { const t = e.changedTouches[0]; const dx = t.clientX - touchX; const dy = t.clientY - touchY; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1); }, { passive: true });

// ── step 2: decide, edit, undo, stop (DOM part) ──
const PAGE_HDR = { 'X-Bpa-Page': '1' };
let actionToken = null; let tokenAsked = false;
const stopUi = { stopped: false, armed: false, timer: null };
state.busy = false; state.editing = false;
const SESSION_ENDED = 'Your session ended. Reload the page.';
const ENFORCED_TEXT = 'All clips that were ready are decided. From now on the automatic posting uses only the clips you approve.';
const DONE_TEXT = { approve: 'Approved. You can undo it under What I decided.', skip: 'Skipped. You can undo it under What I decided.', edit: 'Saved and approved.', undo: 'Undone. It is back in the waiting list.' };

function isTyping(e) { const t = e.target; return !!t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable === true); }
function setNotice(text) { $('notice').textContent = text; }
function actionHeaders() { return { 'Content-Type': 'application/json', 'X-Bpa-Action': actionToken || '' }; }
function postDecide(body) { return fetch('api/decide', { method: 'POST', headers: actionHeaders(), body: JSON.stringify(body) }); }
function postPosting(body) { return fetch('api/posting', { method: 'POST', headers: actionHeaders(), body: JSON.stringify(body) }); }

async function fetchToken() {
  try {
    const res = await fetch('api/session', { method: 'POST', headers: PAGE_HDR });
    if (!res.ok) { actionToken = null; return false; }
    const j = await res.json(); actionToken = j && typeof j.token === 'string' ? j.token : null; return actionToken !== null;
  } catch (e) { actionToken = null; return false; }
}
// A lost session (server restarted): ask the page address again, marked as a page request, so the browser gets a new cookie. The page is not reloaded, so the open card and the typed text stay.
async function renewSession() {
  for (let attempt = 0; attempt < 2; attempt++) {
    let res; try { res = await fetch('./', { headers: PAGE_HDR, cache: 'no-store' }); } catch (e) { return false; }
    if (res.status === 429 && attempt === 0) { await new Promise((r) => setTimeout(r, 3000)); continue; }
    if (!res.ok) return false;
    break;
  }
  return fetchToken();
}
// One send, and after a 403 one renewal and one retry of the same body.
async function callServer(send, body) {
  let retried = false;
  for (;;) {
    let res; try { res = await send(body); } catch (e) { return { net: true }; }
    const step = tokenStep({ status: res.status, retried });
    if (step === 'refresh-and-retry') { retried = true; if (!(await renewSession())) return { expired: true }; continue; }
    if (step === 'give-up') return { expired: res.status === 403 };
    let data = null; try { data = await res.json(); } catch (e) { data = null; }
    return { data };
  }
}

function setBusy(on) {
  state.busy = on;
  for (const id of ['act-approve', 'act-skip', 'act-edit', 'edit-save', 'edit-cancel', 'stop-all']) $(id).disabled = on;
  for (const b of $('decided-list').querySelectorAll('button')) b.disabled = on;
  if (on) setNotice('Saving…');
}
function currentItem() { return shownItems()[state.index] || null; }
function renderActions(item) {
  const have = item && Array.isArray(item.actions) ? item.actions : [];
  for (const a of ['approve', 'skip', 'edit']) $('act-' + a).classList.toggle('hidden', have.indexOf(a) < 0);
  $('actions').classList.toggle('hidden', !(have.indexOf('approve') >= 0 || have.indexOf('skip') >= 0 || have.indexOf('edit') >= 0));
}
function renderDecided() {
  const rows = decidedItems(state.items); const list = $('decided-list'); clear(list);
  $('decided-summary').textContent = 'What I decided (' + rows.length + ')';
  for (const it of rows) {
    const li = el('li'); const left = el('span'); left.appendChild(document.createTextNode(decidedLine(it)));
    const d = dateText(it.decision.at); if (d) left.appendChild(el('span', d, 'when'));
    const b = el('button', 'Undo'); b.type = 'button'; b.disabled = state.busy;
    b.addEventListener('click', () => { decide('undo', undefined, it); });
    li.appendChild(left); li.appendChild(b); list.appendChild(li);
  }
}
function openEdit() {
  const item = currentItem(); if (!item || !Array.isArray(item.actions) || item.actions.indexOf('edit') < 0) return;
  $('edit-text').value = item.title; $('edit-error').textContent = ''; $('edit-box').classList.remove('hidden'); state.editing = true; state.editId = item.id; countEdit(); $('edit-text').focus();
}
function closeEdit() { $('edit-box').classList.add('hidden'); $('edit-error').textContent = ''; state.editing = false; }
function countEdit() { $('edit-count').textContent = $('edit-text').value.length + ' of ' + EDIT_MAX; }

async function decide(action, text, fromList) {
  if (state.busy) return;
  const item = fromList || currentItem(); const req = decisionRequest(item, action, text);
  if (!req) {
    if (action === 'edit') $('edit-error').textContent = BAD_EDIT_CHARS.test(String(text)) ? refusalText('bad-characters') : 'Write between 1 and ' + EDIT_MAX + ' characters on one line.';
    return;
  }
  setBusy(true); $('edit-error').textContent = '';
  const r = await callServer(postDecide, req);
  setBusy(false);
  if (r.expired) { setNotice(SESSION_ENDED); return; }
  const d = r.data;
  if (!d || typeof d !== 'object') { setNotice(refusalText('bad-request')); return; }
  if (d.ok === true) {
    closeEdit(); setNotice(DONE_TEXT[action] + (d.enforced === true ? ' ' + ENFORCED_TEXT : ''));
    await load(); $('card-title').focus({ preventScroll: true }); return;
  }
  const sentence = refusalText(d.code); setNotice(sentence);
  if (action === 'edit') $('edit-error').textContent = sentence;
  if (afterRefusal(d.code) === 'reload') await load();
}

async function stopOrStart() {
  if (state.busy) return;
  if (!stopUi.armed) { stopUi.armed = true; renderStop(); stopUi.timer = setTimeout(() => { stopUi.armed = false; renderStop(); }, 5000); return; }
  if (stopUi.timer) { clearTimeout(stopUi.timer); stopUi.timer = null; }
  stopUi.armed = false; const action = stopUi.stopped ? 'start' : 'stop';
  setBusy(true);
  const r = await callServer(postPosting, { action });
  setBusy(false);
  if (r.expired) { setNotice(SESSION_ENDED); renderStop(); return; }
  const d = r.data;
  if (!d || typeof d !== 'object') setNotice(refusalText('bad-request'));
  else if (d.ok === true) setNotice(action === 'stop' ? 'Posting is stopped.' : 'Posting is allowed again.');
  else setNotice(refusalText(d.code));
  await load(); renderStop();
}
function renderStop() { $('stop-all').textContent = stopButtonText(stopUi); }

$('act-approve').addEventListener('click', () => { decide('approve'); });
$('act-skip').addEventListener('click', () => { decide('skip'); });
$('act-edit').addEventListener('click', () => { openEdit(); });
$('edit-save').addEventListener('click', () => { decide('edit', $('edit-text').value); });
$('edit-cancel').addEventListener('click', () => { closeEdit(); });
$('edit-text').addEventListener('input', countEdit);
$('stop-all').addEventListener('click', () => { stopOrStart(); });
document.addEventListener('keydown', (e) => {
  const item = currentItem();
  const act = keyAction(e, { wide: window.matchMedia('(min-width: 900px)').matches, typing: isTyping(e), busy: state.busy, editing: state.editing, actions: item && Array.isArray(item.actions) ? item.actions : [] });
  if (!act || (state.editing && act !== 'cancel')) return;
  e.preventDefault();
  if (act === 'cancel') closeEdit(); else if (act === 'edit') openEdit(); else decide(act);
});
$('decided').open = window.matchMedia('(min-width: 900px)').matches;
renderStop();
load();
</script>
</body>
</html>
